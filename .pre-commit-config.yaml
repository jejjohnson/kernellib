repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
        # mkdocs.yml uses a !!python/name tag (superfences mermaid fence);
        # --unsafe checks syntax without constructing Python objects.
        args: [--unsafe]
      - id: check-added-large-files
        # Executed notebooks embed their figures (see CLAUDE.md), which puts a
        # typical example notebook at 0.3-0.8 MB. 1 MB still catches runaway
        # outputs and accidental data files.
        args: [--maxkb=1024]
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.8
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
