name: Deploy Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install mystmd
        run: npm install -g mystmd

      - name: Install docs dependencies
        run: uv sync --group docs

      # BASE_URL is the project-pages subpath. mystmd prepends it to its own
      # links, and scripts/build_docs.py uses it when rewriting the API
      # cross-references, so both halves agree on where the site is mounted.
      - name: Build and verify the documentation site
        env:
          BASE_URL: /${{ github.event.repository.name }}
        run: uv run python scripts/build_docs.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v5
        with:
          path: public/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
