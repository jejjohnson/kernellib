name: Docs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install mystmd
        run: npm install -g mystmd

      - name: Install docs dependencies
        run: uv sync --group docs

      # Builds both halves, assembles them into public/, repairs the
      # cross-generator references, and fails if any internal link — in either
      # half, or crossing between them — does not resolve.
      - name: Build and verify the documentation site
        run: uv run python scripts/build_docs.py

      - name: Upload site
        uses: actions/upload-artifact@v7
        with:
          name: docs-site
          path: public/
