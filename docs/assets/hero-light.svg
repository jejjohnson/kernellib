<text x="38" y="176" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" font-weight="400" fill="#1F2937" xml:space="preserve">k = kl.Matern(lengthscale=20.0, nu=1.5)</text>
