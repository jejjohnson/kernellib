<svg xmlns="http://www.w3.org/2000/svg" width="960" height="356" viewBox="0 0 960 356" role="img" aria-label="One kernel object evaluates a Gram matrix, becomes a gaussx operator, approximates itself with feature maps, and feeds the regression and dependence methods.">
