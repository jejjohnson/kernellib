<text x="38" y="216" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" font-weight="400" fill="#1F2937" xml:space="preserve">dk = kl.Derivative(k, dx=0)</text>
